{{- $namespace := .Values.namespace | default .Release.Namespace -}}
{{- $watchNamespace := .Values.operator.watchNamespace | default $namespace -}}
{{- $rayClusterNamespace := .Values.operator.rayClusterNamespace | default $watchNamespace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ $namespace }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ray-plugin-operator
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ray-plugin-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --ray-cluster-name={{ .Values.operator.rayClusterName }}
            - --ray-cluster-namespace={{ $rayClusterNamespace }}
            - --watch-namespace={{ $watchNamespace }}
            - --registry-configmap={{ .Values.operator.registryConfigMap }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
