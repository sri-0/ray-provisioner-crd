apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rayplugins.ray.provisioner.io
spec:
  group: ray.provisioner.io
  names:
    kind: RayPlugin
    listKind: RayPluginList
    plural: rayplugins
    singular: rayplugin
    shortNames:
      - rplug
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: WorkerGroup
          type: string
          jsonPath: .status.workerGroupName
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - enabled
                - image
                - rayClusterRef
                - plugin
              properties:
                enabled:
                  type: boolean
                image:
                  type: string
                  minLength: 1
                rayClusterRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                workerGroup:
                  type: object
                  properties:
                    replicas:
                      type: integer
                      format: int32
                      minimum: 0
                    minReplicas:
                      type: integer
                      format: int32
                      minimum: 0
                    maxReplicas:
                      type: integer
                      format: int32
                      minimum: 0
                    rayStartParams:
                      type: object
                      additionalProperties:
                        type: string
                    resources:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                        gpu:
                          type: string
                    env:
                      type: array
                      x-kubernetes-preserve-unknown-fields: true
                      items:
                        type: object
                plugin:
                  type: object
                  required:
                    - entrypoint
                  properties:
                    entrypoint:
                      type: string
                      minLength: 1
                    dataTypes:
                      type: array
                      items:
                        type: string
                    dependsOn:
                      type: array
                      items:
                        type: string
                    supportsDistributed:
                      type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                workerGroupName:
                  type: string
                readyReplicas:
                  type: integer
                  format: int32
                observedGeneration:
                  type: integer
                  format: int64
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
